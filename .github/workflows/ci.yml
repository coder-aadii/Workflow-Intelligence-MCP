# ---------------------------------------------------------------
# GitHub Actions CI — Workflow Intelligence MCP (v1.0.0)
#
# Triggered on pull requests and pushes to `main`.
#
# Jobs:
#   lint     : Ruff format check + linter.
#   typecheck: Mypy strict type checking.
#   test     : Pytest (unit + integration + protocol) with coverage
#              threshold >= 85%.
#   docker-build: Build the Docker image and verify the entrypoint runs.
# ---------------------------------------------------------------

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff linter
        run: ruff check src tests scripts

      - name: Run ruff format check
        run: ruff format --check src tests scripts

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy strict type check
        run: mypy

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite with coverage
        run: |
          pytest --cov=workflow_intelligence --cov-report=term --cov-report=xml

      - name: Enforce coverage threshold >= 85%
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          tree = ET.parse("coverage.xml")
          root = tree.getroot()
          line_rate = float(root.attrib.get("line-rate", "0")) * 100
          print(f"Coverage: {line_rate:.2f}%")
          if line_rate < 85.0:
              raise SystemExit(f"Coverage {line_rate:.2f}% is below 85% threshold")
          EOF

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  docker-build:
    name: Docker build & entrypoint
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: workflow-intelligence-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify entrypoint runs (help)
        run: |
          docker run --rm workflow-intelligence-mcp:latest --help
