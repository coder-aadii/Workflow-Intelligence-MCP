[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "workflow-intelligence-mcp"
version = "0.1.0"
description = "MCP server for process intelligence, workflow exception reasoning, and evidence-backed business decisions."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "coder-aadii", email = "aditya.aerpule191996@gmail.com" }
]
dependencies = [
  "mcp>=1.2.0",
  "fastmcp>=0.4.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "pm4py>=2.7.11",
  "duckdb>=1.0.0",
  "pandas>=2.2.0",
  "structlog>=24.1.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/coder-aadii/Workflow-Intelligence-MCP"
Repository = "https://github.com/coder-aadii/Workflow-Intelligence-MCP"
Issues = "https://github.com/coder-aadii/Workflow-Intelligence-MCP/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/workflow_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pm4py", "pm4py.*", "duckdb", "duckdb.*"]
ignore_missing_imports = true
