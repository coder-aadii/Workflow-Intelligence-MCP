# Alembic configuration for Workflow Intelligence MCP database migrations.

[alembic]
# path to migration scripts
script_location = src/workflow_intelligence/persistence/migrations
prepend_sys_path = .
version_location = src/workflow_intelligence/persistence/migrations/versions

# Database URL (overridden by the DATABASE_URL environment variable).
sqlalchemy.url = %(DATABASE_URL)s

# Template used to generate migration file names.
file_template = %%(rev)s_%%(slug)s

# Version location
version_path_separator = os

# Max length of characters to apply to the version slug
truncate_slug_length = 40

[post_write_hooks]
# Runs after a new migration file is generated
hooks = blackrun
blackrun.type = console_scripts
blackrun.entrypoint = black
blackrun.options = -l 88 %(version)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
